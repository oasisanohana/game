<script>

/* ================================
   CANVAS
================================ */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);


/* ================================
   GAME VARIABLES
================================ */

let gameStarted = false;

let distance = 0;
let score = 0;
let cameraX = 0;

let playerHP = 100;

let gameMessageTimer = 0;


/* ================================
   PLAYER
================================ */

const player = {

    x: 150,
    y: 0,

    width: 50,
    height: 80,

    velocityX: 0,
    velocityY: 0,

    speed: 3,

    jumping: false,
    attacking: false,

    walkFrame: 0,
    walkTimer: 0,

    invincible: false

};


/* ================================
   PHYSICS
================================ */

const gravity = 0.8;
const groundOffset = 130;


/* ================================
   MONSTER
================================ */

const monster = {

    active: false,

    x: 0,
    y: 0,

    width: 65,
    height: 65,

    hp: 100,

    direction: 1,

    animation: 0

};


/* ================================
   OBSTACLES
================================ */

let obstacles = [];

let nextObstacleDistance = 40;


/*
สร้างสิ่งกีดขวาง

rock = ก้อนหิน
spike = หนาม
pit = หลุม
*/

function createObstacle() {

    const types = [
        "rock",
        "spike",
        "pit"
    ];

    const type =
    types[
        Math.floor(
            Math.random() * types.length
        )
    ];


    let obstacle = {

        type: type,

        x:
        cameraX +
        canvas.width +

        150 +

        Math.random() * 200,

        width: 0,

        height: 0,

        hit: false

    };


    if (type === "rock") {

        obstacle.width = 55;
        obstacle.height = 45;

    }


    if (type === "spike") {

        obstacle.width = 55;
        obstacle.height = 45;

    }


    if (type === "pit") {

        obstacle.width = 100;
        obstacle.height = 20;

    }


    obstacles.push(obstacle);

}


/* ================================
   TREES
================================ */

let trees = [];

function createWorld() {

    for (let i = 0; i < 80; i++) {

        trees.push({

            x:
            i * 250 +
            Math.random() * 150,

            size:
            60 +
            Math.random() * 50

        });

    }

}

createWorld();


/* ================================
   MICROPHONE
================================ */

let analyser;
let audioData;
let volume = 0;


async function setupMicrophone() {

    const stream =
    await navigator.mediaDevices
    .getUserMedia({
        audio: true
    });


    const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    analyser =
    audioContext.createAnalyser();

    analyser.fftSize = 256;


    const source =
    audioContext
    .createMediaStreamSource(stream);


    source.connect(analyser);


    audioData =
    new Uint8Array(
        analyser.frequencyBinCount
    );

}


/* ================================
   SOUND CONTROL
================================ */

function checkSound() {

    if (!analyser) return;


    analyser.getByteFrequencyData(
        audioData
    );


    let sum = 0;


    for (
        let i = 0;
        i < audioData.length;
        i++
    ) {

        sum += audioData[i];

    }


    volume =
    sum / audioData.length;


    const percent =
    Math.min(
        volume * 2,
        100
    );


    document
    .getElementById("soundFill")
    .style.width =
    percent + "%";


    /* เดิน */

    if (
        volume > 10 &&
        !monster.active
    ) {

        player.velocityX =
        player.speed;

    }

    else {

        player.velocityX = 0;

    }


    /* กระโดด */

    if (

        volume > 45 &&

        !player.jumping &&

        !monster.active

    ) {

        jump();

    }

}


/* ================================
   JUMP
================================ */

function jump() {

    player.velocityY = -16;

    player.jumping = true;

}


/* ================================
   OBSTACLE SPAWN
================================ */

function checkObstacleSpawn() {

    if (
        distance >=
        nextObstacleDistance
    ) {

        createObstacle();


        nextObstacleDistance +=

        Math.floor(
            Math.random() * 50
        ) + 40;

    }

}


/* ================================
   COLLISION
================================ */

function checkObstacleCollision() {

    const playerWorldX =
    cameraX + player.x;


    const playerBottom =
    player.y + player.height;


    for (const obstacle of obstacles) {

        if (obstacle.hit) continue;


        /*
        หลุม
        */

        if (obstacle.type === "pit") {

            if (

                playerWorldX +
                player.width >
                obstacle.x &&

                playerWorldX <
                obstacle.x +
                obstacle.width &&

                !player.jumping

            ) {

                hitObstacle(obstacle);

            }

        }


        /*
        ก้อนหิน / หนาม
        */

        else {

            const obstacleY =

            canvas.height -
            groundOffset -
            obstacle.height;


            if (

                playerWorldX +
                player.width >
                obstacle.x &&

                playerWorldX <
                obstacle.x +
                obstacle.width &&

                playerBottom >
                obstacleY

            ) {

                hitObstacle(obstacle);

            }

        }

    }

}


function hitObstacle(obstacle) {

    obstacle.hit = true;


    if (player.invincible) return;


    playerHP -= 20;


    player.invincible = true;


    document
    .getElementById("message")
    .innerHTML =
    "💥 ชนสิ่งกีดขวาง!<br>❤️ HP -20";


    setTimeout(() => {

        player.invincible = false;

    }, 1500);


    setTimeout(() => {

        document
        .getElementById("message")
        .innerHTML =
        "🎤 พูดเพื่อเดิน<br>🔊 เสียงดังเพื่อกระโดด";

    }, 2000);


    if (playerHP <= 0) {

        gameOver();

    }

}


/* ================================
   GAME OVER
================================ */

function gameOver() {

    gameStarted = false;


    document
    .getElementById("message")
    .innerHTML =
    "💀 GAME OVER<br><br>คะแนน: " +
    score;


    setTimeout(() => {

        location.reload();

    }, 4000);

}


/* ================================
   MONSTER SPAWN
================================ */

let nextMonsterDistance = 120;


function checkMonsterSpawn() {

    if (

        distance >=
        nextMonsterDistance &&

        !monster.active

    ) {

        monster.active = true;

        monster.hp = 100;


        monster.x =

        cameraX +
        canvas.width *
        0.75;


        monster.y =

        canvas.height -
        groundOffset -
        monster.height;


        document
        .getElementById("message")
        .innerHTML =
        "⚠️ มอนสเตอร์มาแล้ว!<br>📳 เขย่าเพื่อต่อย";

    }

}


/* ================================
   SHAKE DETECTION
================================ */

let lastShake = 0;


function detectShake(event) {

    if (!gameStarted) return;


    const acc =
    event.accelerationIncludingGravity;


    if (!acc) return;


    const force =

        Math.abs(acc.x || 0) +

        Math.abs(acc.y || 0) +

        Math.abs(acc.z || 0);


    const now =
    Date.now();


    if (

        force > 32 &&

        now - lastShake > 350

    ) {

        lastShake = now;

        attack();

    }

}


function attack() {

    if (!monster.active) return;


    player.attacking = true;


    const damage =

    Math.floor(
        Math.random() * 15
    ) + 10;


    monster.hp -= damage;


    if (monster.hp < 0) {

        monster.hp = 0;

    }


    setTimeout(() => {

        player.attacking = false;

    }, 250);


    if (monster.hp <= 0) {

        defeatMonster();

    }

}


/* ================================
   MONSTER DEFEATED
================================ */

function defeatMonster() {

    monster.active = false;

    score += 100;

    nextMonsterDistance += 120;


    document
    .getElementById("message")
    .innerHTML =
    "🏆 กำจัดมอนสเตอร์แล้ว!<br>🎤 เดินทางต่อได้";


    setTimeout(() => {

        document
        .getElementById("message")
        .innerHTML =
        "🎤 พูดเพื่อเดิน<br>🔊 เสียงดังเพื่อกระโดด";

    }, 2000);

}


/* ================================
   MOTION PERMISSION
================================ */

async function setupMotion() {

    if (

        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof
        DeviceMotionEvent.requestPermission ===
        "function"

    ) {

        await
        DeviceMotionEvent
        .requestPermission();

    }


    window.addEventListener(

        "devicemotion",

        detectShake

    );

}


/* ================================
   START GAME
================================ */

async function startGame() {

    try {

        await setupMicrophone();

        await setupMotion();


        gameStarted = true;


        document
        .getElementById("startScreen")
        .style.display =
        "none";


        gameLoop();

    }

    catch(error) {

        alert(
            "กรุณาอนุญาตการใช้ไมโครโฟนและ Motion Sensor"
        );

        console.error(error);

    }

}


/* ================================
   UPDATE
================================ */

function update() {

    if (!gameStarted) return;


    checkSound();


    /*
    PLAYER WALK
    */

    if (

        player.velocityX > 0 &&

        !monster.active

    ) {

        cameraX +=
        player.velocityX;


        distance += 0.1;

        score++;


        player.walkTimer++;


        if (
            player.walkTimer > 8
        ) {

            player.walkFrame =
            1 -
            player.walkFrame;


            player.walkTimer = 0;

        }

    }


    /*
    GRAVITY
    */

    player.velocityY += gravity;

    player.y +=
    player.velocityY;


    const groundY =

    canvas.height -
    groundOffset -
    player.height;


    if (
        player.y >= groundY
    ) {

        player.y = groundY;

        player.velocityY = 0;

        player.jumping = false;

    }


    /*
    MONSTER ANIMATION
    */

    if (monster.active) {

        monster.animation +=
        0.08;


        monster.x +=
        monster.direction *
        1.2;


        const minX =

        cameraX +
        canvas.width *
        0.55;


        const maxX =

        cameraX +
        canvas.width *
        0.8;


        if (

            monster.x < minX ||

            monster.x > maxX

        ) {

            monster.direction *= -1;

        }

    }


    checkObstacleSpawn();

    checkObstacleCollision();

    checkMonsterSpawn();

}


/* ================================
   DRAW BACKGROUND
================================ */

function drawBackground() {

    /*
    SKY
    */

    ctx.fillStyle =
    "#38bdf8";


    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
    CLOUDS
    */

    ctx.fillStyle =
    "rgba(255,255,255,0.8)";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        let x =

        (
            i * 280 -
            cameraX * 0.1
        )

        % (canvas.width + 300);


        if (x < -100)
            x += canvas.width + 300;


        const y =
        60 + i * 50;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI * 2
        );


        ctx.arc(
            x + 35,
            y - 10,
            35,
            0,
            Math.PI * 2
        );


        ctx.arc(
            x + 70,
            y,
            25,
            0,
            Math.PI * 2
        );


        ctx.fill();

    }


    /*
    GROUND
    */

    ctx.fillStyle =
    "#22c55e";


    ctx.fillRect(

        0,

        canvas.height -
        groundOffset,

        canvas.width,

        groundOffset

    );

}


/* ================================
   DRAW TREES
================================ */

function drawTrees() {

    for (const tree of trees) {

        const screenX =

        tree.x -
        cameraX * 0.5;


        if (

            screenX < -150 ||

            screenX >
            canvas.width + 150

        ) continue;


        /*
        TRUNK
        */

        ctx.fillStyle =
        "#78350f";


        ctx.fillRect(

            screenX,

            canvas.height -
            groundOffset -
            tree.size,

            20,

            tree.size

        );


        /*
        LEAVES
        */

        ctx.fillStyle =
        "#15803d";


        ctx.beginPath();


        ctx.arc(

            screenX + 10,

            canvas.height -
            groundOffset -
            tree.size,

            tree.size * 0.55,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


/* ================================
   DRAW OBSTACLES
================================ */

function drawObstacles() {

    for (const obstacle of obstacles) {

        const x =
        obstacle.x -
        cameraX;


        /*
        ROCK
        */

        if (
            obstacle.type ===
            "rock"
        ) {

            ctx.fillStyle =
            "#6b7280";


            ctx.beginPath();


            ctx.arc(

                x +
                obstacle.width / 2,

                canvas.height -
                groundOffset -
                obstacle.height / 2,

                obstacle.width / 2,

                Math.PI,

                0

            );


            ctx.fill();

        }


        /*
        SPIKE
        */

        if (
            obstacle.type ===
            "spike"
        ) {

            ctx.fillStyle =
            "#ef4444";


            for (
                let i = 0;
                i < 4;
                i++
            ) {

                ctx.beginPath();


                ctx.moveTo(

                    x + i * 14,

                    canvas.height -
                    groundOffset

                );


                ctx.lineTo(

                    x + 7 + i * 14,

                    canvas.height -
                    groundOffset -
                    obstacle.height

                );


                ctx.lineTo(

                    x + 14 + i * 14,

                    canvas.height -
                    groundOffset

                );


                ctx.fill();

            }

        }


        /*
        PIT
        */

        if (
            obstacle.type ===
            "pit"
        ) {

            ctx.fillStyle =
            "#111827";


            ctx.fillRect(

                x,

                canvas.height -
                groundOffset,

                obstacle.width,

                35

            );


            /*
            ขอบหลุม
            */

            ctx.strokeStyle =
            "#78350f";


            ctx.lineWidth = 6;


            ctx.strokeRect(

                x,

                canvas.height -
                groundOffset,

                obstacle.width,

                30

            );

        }

    }

}


/* ================================
   DRAW PLAYER
================================ */

function drawPlayer() {

    const x =
    player.x;


    const y =
    player.y;


    ctx.save();


    /*
    กระพริบเมื่อโดนชน
    */

    if (

        player.invincible &&

        Math.floor(Date.now() / 100) % 2 === 0

    ) {

        ctx.globalAlpha =
        0.4;

    }


    /*
    ATTACK MOVEMENT
    */

    if (
        player.attacking
    ) {

        ctx.translate(
            15,
            0
        );

    }


    /*
    BODY
    */

    ctx.fillStyle =
    "#2563eb";


    ctx.fillRect(

        x + 15,

        y + 25,

        25,

        35

    );


    /*
    HEAD
    */

    ctx.fillStyle =
    "#f5cba7";


    ctx.beginPath();


    ctx.arc(

        x + 27,

        y + 15,

        15,

        0,

        Math.PI * 2

    );


    ctx.fill();


    /*
    LEGS
    */

    ctx.strokeStyle =
    "#111827";

    ctx.lineWidth =
    8;


    ctx.beginPath();


    let leg =
    0;


    if (
        player.velocityX > 0
    ) {

        leg =
        player.walkFrame ?
        10 :
        -10;

    }


    ctx.moveTo(
        x + 22,
        y + 60
    );


    ctx.lineTo(
        x + 20 + leg,
        y + 80
    );


    ctx.moveTo(
        x + 32,
        y + 60
    );


    ctx.lineTo(
        x + 35 - leg,
        y + 80
    );


    ctx.stroke();


    /*
    ARM
    */

    ctx.beginPath();


    ctx.moveTo(
        x + 15,
        y + 35
    );


    if (
        player.attacking
    ) {

        ctx.lineTo(
            x + 60,
            y + 30
        );

    }

    else {

        ctx.lineTo(
            x + 5,
            y + 55
        );

    }


    ctx.stroke();


    ctx.restore();

}


/* ================================
   DRAW MONSTER
================================ */

function drawMonster() {

    if (!monster.active) return;


    const x =
    monster.x -
    cameraX;


    const bob =

    Math.sin(
        monster.animation
    ) * 8;


    /*
    BODY
    */

    ctx.fillStyle =
    "#ef4444";


    ctx.beginPath();


    ctx.arc(

        x +
        monster.width / 2,

        monster.y +
        monster.height / 2 +
        bob,

        monster.width / 2,

        0,

        Math.PI * 2

    );


    ctx.fill();


    /*
    EYES
    */

    ctx.fillStyle =
    "white";


    ctx.beginPath();


    ctx.arc(
        x + 20,
        monster.y + 25 + bob,
        8,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 45,
        monster.y + 25 + bob,
        8,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
    PUPILS
    */

    ctx.fillStyle =
    "black";


    ctx.beginPath();


    ctx.arc(
        x + 20,
        monster.y + 25 + bob,
        3,
        0,
        Math.PI * 2
    );


    ctx.arc(
        x + 45,
        monster.y + 25 + bob,
        3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
    HP BAR
    */

    ctx.fillStyle =
    "#374151";


    ctx.fillRect(
        x,
        monster.y - 25,
        75,
        12
    );


    ctx.fillStyle =
    "#ef4444";


    ctx.fillRect(

        x,

        monster.y - 25,

        75 *
        (monster.hp / 100),

        12

    );

}


/* ================================
   DRAW HUD
================================ */

function drawHUD() {

    /*
    HUD BOX
    */

    ctx.fillStyle =
    "rgba(0,0,0,0.55)";


    ctx.fillRect(
        10,
        10,
        220,
        115
    );


    ctx.fillStyle =
    "white";


    ctx.font =
    "18px Arial";


    ctx.fillText(

        "❤️ HP: " +
        playerHP,

        20,
        38

    );


    ctx.fillText(

        "📍 Distance: " +
        Math.floor(distance) +
        " m",

        20,
        68

    );


    ctx.fillText(

        "🏆 Score: " +
        score,

        20,
        98

    );


    /*
    NEXT OBSTACLE
    */

    ctx.fillStyle =
    "rgba(0,0,0,0.55)";


    ctx.fillRect(

        canvas.width - 220,

        10,

        210,

        70

    );


    ctx.fillStyle =
    "white";


    ctx.font =
    "14px Arial";


    ctx.fillText(

        "🪨 ระวังสิ่งกีดขวาง!",

        canvas.width - 205,

        38

    );


    ctx.fillText(

        "Next Monster: " +
        Math.floor(
            nextMonsterDistance
        ) +
        "m",

        canvas.width - 205,

        62

    );

}


/* ================================
   GAME LOOP
================================ */

function gameLoop() {

    update();


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    drawTrees();

    drawObstacles();

    drawPlayer();

    drawMonster();

    drawHUD();


    requestAnimationFrame(
        gameLoop
    );

}

</script>
