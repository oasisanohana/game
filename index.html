<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Voice & Shake Adventure</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111827;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    position: fixed;
    inset: 0;

    background: linear-gradient(
        135deg,
        #111827,
        #1e3a8a
    );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 25px;

    z-index: 100;
}

.card {
    max-width: 500px;
}

h1 {
    font-size: 30px;
}

p {
    line-height: 1.8;
    color: #d1d5db;
}

button {

    width: 100%;

    padding: 17px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    background: #22c55e;

    color: white;

}

button:active {
    transform: scale(0.97);
}

/* =========================
   SOUND METER
========================= */

#soundUI {

    position: fixed;

    bottom: 20px;

    left: 20px;

    right: 20px;

    color: white;

    z-index: 20;

}

#soundBar {

    width: 100%;

    height: 20px;

    background: rgba(0,0,0,0.5);

    border-radius: 20px;

    overflow: hidden;

}

#soundFill {

    width: 0%;

    height: 100%;

    background: #22c55e;

    transition: width 0.05s;

}

/* =========================
   MESSAGE
========================= */

#message {

    position: fixed;

    top: 45%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    text-shadow:
        2px 2px 5px black;

    z-index: 30;

}
</style>

</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="soundUI">

<div id="startScreen">

```
<div class="card">

    <h1>🎮 VOICE & SHAKE ADVENTURE</h1>

    <p>

        🎤 พูดเพื่อเดิน<br>

        🔊 พูดเสียงดังเพื่อกระโดด<br>

        📳 เขย่าโทรศัพท์เพื่อต่อย<br>

        👾 กำจัดมอนสเตอร์เพื่อเดินทางต่อ

    </p>

    <button onclick="startGame()">

        🚀 อนุญาตและเริ่มเกม

    </button>

</div>

</div>

<script>

/* =================================
   CANVAS
================================= */

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =================================
   GAME VARIABLES
================================= */

let gameStarted = false;

let distance = 0;

let score = 0;

let cameraX = 0;

let worldOffset = 0;


/* =================================
   PLAYER
================================= */

const player = {

    x: 150,

    y: 0,

    width: 50,

    height: 80,

    velocityY: 0,

    velocityX: 0,

    speed: 3,

    jumping: false,

    attacking: false,

    walkFrame: 0,

    walkTimer: 0

};


/* =================================
   PHYSICS
================================= */

const gravity = 0.8;

const groundOffset = 130;


/* =================================
   MONSTER
================================= */

const monster = {

    active: false,

    x: 0,

    y: 0,

    width: 65,

    height: 65,

    hp: 100,

    direction: 1,

    animation: 0,

    defeated: 0

};


/* =================================
   WORLD OBJECTS
================================= */

let trees = [];


function createWorld() {

    for (let i = 0; i < 50; i++) {

        trees.push({

            x: i * 250 +
            Math.random() * 150,

            size:
            60 + Math.random() * 50

        });

    }

}

createWorld();


/* =================================
   MICROPHONE
================================= */

let analyser;

let audioData;


async function setupMicrophone() {

    const stream =
    await navigator.mediaDevices
    .getUserMedia({

        audio: true

    });


    const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    analyser =
    audioContext.createAnalyser();


    analyser.fftSize = 256;


    const source =
    audioContext
    .createMediaStreamSource(stream);


    source.connect(analyser);


    audioData =
    new Uint8Array(
        analyser.frequencyBinCount
    );

}


/* =================================
   SOUND DETECTION
================================= */

let volume = 0;


function checkSound() {

    if (!analyser) return;


    analyser.getByteFrequencyData(
        audioData
    );


    let sum = 0;


    for (
        let i = 0;
        i < audioData.length;
        i++
    ) {

        sum += audioData[i];

    }


    volume =
    sum / audioData.length;


    const percent =
    Math.min(volume * 2, 100);


    document
    .getElementById("soundFill")
    .style.width =
    percent + "%";


    /* =============================
       WALK
    ============================= */

    if (
        volume > 10 &&
        !monster.active
    ) {

        player.velocityX =
        player.speed;

    }

    else {

        player.velocityX = 0;

    }


    /* =============================
       JUMP
    ============================= */

    if (

        volume > 45 &&

        !player.jumping &&

        !monster.active

    ) {

        jump();

    }

}


/* =================================
   JUMP
================================= */

function jump() {

    player.velocityY = -16;

    player.jumping = true;

}


/* =================================
   MONSTER SPAWN
================================= */

let nextMonsterDistance = 100;


function checkMonsterSpawn() {

    if (

        distance >= nextMonsterDistance &&

        !monster.active

    ) {

        monster.active = true;

        monster.hp = 100;

        monster.x =
        cameraX + canvas.width * 0.75;

        monster.y =
        canvas.height -
        groundOffset -
        monster.height;


        document
        .getElementById("message")
        .innerHTML =
        "⚠️ มอนสเตอร์มาแล้ว!<br>📳 เขย่าเพื่อต่อย";


    }

}


/* =================================
   SHAKE DETECTION
================================= */

let lastShake = 0;


function detectShake(event) {

    if (!gameStarted) return;


    const acc =
    event.accelerationIncludingGravity;


    if (!acc) return;


    const force =

        Math.abs(acc.x || 0) +

        Math.abs(acc.y || 0) +

        Math.abs(acc.z || 0);


    const now = Date.now();


    if (

        force > 32 &&

        now - lastShake > 350

    ) {

        lastShake = now;

        attack();

    }

}


function attack() {

    if (!monster.active) return;


    player.attacking = true;


    const damage =
    Math.floor(
        Math.random() * 15
    ) + 10;


    monster.hp -= damage;


    if (monster.hp < 0) {

        monster.hp = 0;

    }


    setTimeout(() => {

        player.attacking = false;

    }, 250);


    if (monster.hp <= 0) {

        defeatMonster();

    }

}


/* =================================
   MONSTER DEFEATED
================================= */

function defeatMonster() {

    monster.active = false;

    monster.defeated = 1;


    score += 100;


    nextMonsterDistance += 100;


    document
    .getElementById("message")
    .innerHTML =
    "🏆 ชนะแล้ว!<br>🎤 เดินทางต่อได้";


    setTimeout(() => {

        document
        .getElementById("message")
        .innerHTML =
        "🎤 พูดเพื่อเดิน<br>🔊 เสียงดังเพื่อกระโดด";

    }, 2000);

}


/* =================================
   MOTION PERMISSION
================================= */

async function setupMotion() {

    if (

        typeof DeviceMotionEvent !==
        "undefined" &&

        typeof
        DeviceMotionEvent.requestPermission ===
        "function"

    ) {

        try {

            await
            DeviceMotionEvent
            .requestPermission();

        }

        catch(error) {

            console.log(error);

        }

    }


    window.addEventListener(

        "devicemotion",

        detectShake

    );

}


/* =================================
   START GAME
================================= */

async function startGame() {

    try {

        await setupMicrophone();

        await setupMotion();


        gameStarted = true;


        document
        .getElementById("startScreen")
        .style.display =
        "none";


        gameLoop();

    }

    catch(error) {

        alert(
            "กรุณาอนุญาตไมโครโฟนก่อนเล่นเกม"
        );

        console.error(error);

    }

}


/* =================================
   UPDATE GAME
================================= */

function update() {

    checkSound();


    /* =============================
       PLAYER MOVEMENT
    ============================= */

    if (

        player.velocityX > 0 &&

        !monster.active

    ) {

        cameraX +=
        player.velocityX;


        distance += 0.1;

        score++;


        player.walkTimer++;


        if (
            player.walkTimer > 8
        ) {

            player.walkFrame =
            1 - player.walkFrame;


            player.walkTimer = 0;

        }

    }


    /* =============================
       GRAVITY
    ============================= */

    player.velocityY += gravity;

    player.y += player.velocityY;


    const groundY =
    canvas.height -
    groundOffset -
    player.height;


    if (
        player.y >= groundY
    ) {

        player.y = groundY;

        player.velocityY = 0;

        player.jumping = false;

    }


    /* =============================
       MONSTER ANIMATION
    ============================= */

    if (monster.active) {

        monster.animation += 0.08;


        monster.x +=
        monster.direction * 1.2;


        const minX =
        cameraX +
        canvas.width * 0.55;


        const maxX =
        cameraX +
        canvas.width * 0.8;


        if (

            monster.x < minX ||

            monster.x > maxX

        ) {

            monster.direction *= -1;

        }

    }


    checkMonsterSpawn();

}


/* =================================
   DRAW BACKGROUND
================================= */

function drawBackground() {

    /* SKY */

    ctx.fillStyle =
    "#38bdf8";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CLOUDS */

    ctx.fillStyle =
    "rgba(255,255,255,0.8)";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const x =
        (
            i * 300 -
            cameraX * 0.1
        )
        % (canvas.width + 300);


        const y =
        60 + i * 55;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 35,
            y - 10,
            35,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 70,
            y,
            30,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* GROUND */

    ctx.fillStyle =
    "#22c55e";

    ctx.fillRect(

        0,

        canvas.height -
        groundOffset,

        canvas.width,

        groundOffset

    );

}


/* =================================
   DRAW TREES
================================= */

function drawTrees() {

    for (const tree of trees) {

        const screenX =
        tree.x - cameraX * 0.5;


        if (

            screenX < -150 ||

            screenX >
            canvas.width + 150

        ) continue;


        /* trunk */

        ctx.fillStyle =
        "#78350f";

        ctx.fillRect(

            screenX,

            canvas.height -
            groundOffset -
            tree.size,

            20,

            tree.size

        );


        /* leaves */

        ctx.fillStyle =
        "#15803d";


        ctx.beginPath();

        ctx.arc(

            screenX + 10,

            canvas.height -
            groundOffset -
            tree.size,

            tree.size * 0.55,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


/* =================================
   DRAW PLAYER
================================= */

function drawPlayer() {

    const x = player.x;

    const y = player.y;


    ctx.save();


    /* ATTACK */

    if (player.attacking) {

        ctx.translate(15, 0);

    }


    /* BODY */

    ctx.fillStyle =
    "#2563eb";


    ctx.fillRect(

        x + 15,

        y + 25,

        25,

        35

    );


    /* HEAD */

    ctx.fillStyle =
    "#f5cba7";


    ctx.beginPath();

    ctx.arc(

        x + 27,

        y + 15,

        15,

        0,

        Math.PI * 2

    );


    ctx.fill();


    /* LEGS ANIMATION */

    ctx.strokeStyle =
    "#111827";

    ctx.lineWidth = 8;


    ctx.beginPath();


    if (
        player.velocityX > 0 &&
        !monster.active
    ) {

        const leg =
        player.walkFrame ? 10 : -10;


        ctx.moveTo(
            x + 22,
            y + 60
        );


        ctx.lineTo(
            x + 20 + leg,
            y + 80
        );


        ctx.moveTo(
            x + 32,
            y + 60
        );


        ctx.lineTo(
            x + 35 - leg,
            y + 80
        );

    }

    else {

        ctx.moveTo(
            x + 22,
            y + 60
        );

        ctx.lineTo(
            x + 20,
            y + 80
        );


        ctx.moveTo(
            x + 32,
            y + 60
        );

        ctx.lineTo(
            x + 35,
            y + 80
        );

    }


    ctx.stroke();


    /* ARMS */

    ctx.beginPath();


    ctx.moveTo(
        x + 15,
        y + 35
    );


    if (player.attacking) {

        ctx.lineTo(
            x + 60,
            y + 30
        );

    }

    else {

        ctx.lineTo(
            x + 5,
            y + 55
        );

    }


    ctx.stroke();


    ctx.restore();

}


/* =================================
   DRAW MONSTER
================================= */

function drawMonster() {

    if (!monster.active) return;


    const screenX =
    monster.x - cameraX;


    const bob =
    Math.sin(
        monster.animation
    ) * 8;


    /* BODY */

    ctx.fillStyle =
    "#ef4444";


    ctx.beginPath();

    ctx.arc(

        screenX +
        monster.width / 2,

        monster.y +
        monster.height / 2 +
        bob,

        monster.width / 2,

        0,

        Math.PI * 2

    );


    ctx.fill();


    /* EYES */

    ctx.fillStyle =
    "white";


    ctx.beginPath();

    ctx.arc(
        screenX + 20,
        monster.y + 25 + bob,
        8,
        0,
        Math.PI * 2
    );


    ctx.arc(
        screenX + 45,
        monster.y + 25 + bob,
        8,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* PUPILS */

    ctx.fillStyle =
    "black";


    ctx.beginPath();

    ctx.arc(
        screenX + 20,
        monster.y + 25 + bob,
        3,
        0,
        Math.PI * 2
    );


    ctx.arc(
        screenX + 45,
        monster.y + 25 + bob,
        3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* HP BAR */

    ctx.fillStyle =
    "#374151";


    ctx.fillRect(
        screenX,
        monster.y - 20,
        70,
        10
    );


    ctx.fillStyle =
    "#ef4444";


    ctx.fillRect(

        screenX,

        monster.y - 20,

        70 *
        (monster.hp / 100),

        10

    );

}


/* =================================
   DRAW HUD
================================= */

function drawHUD() {

    ctx.fillStyle =
    "rgba(0,0,0,0.55)";


    ctx.fillRect(
        10,
        10,
        190,
        80
    );


    ctx.fillStyle =
    "white";


    ctx.font =
    "18px Arial";


    ctx.fillText(

        "📍 Distance: " +
        Math.floor(distance) +
        " m",

        20,
        38

    );


    ctx.fillText(

        "🏆 Score: " +
        score,

        20,
        68

    );


    /* PROGRESS */

    ctx.fillStyle =
    "#374151";


    ctx.fillRect(

        canvas.width - 210,

        20,

        190,

        20

    );


    ctx.fillStyle =
    "#22c55e";


    ctx.fillRect(

        canvas.width - 210,

        20,

        (
            distance % 100
        ) * 1.9,

        20

    );


    ctx.fillStyle =
    "white";


    ctx.font =
    "14px Arial";


    ctx.fillText(

        "Next Monster: " +
        Math.floor(nextMonsterDistance) +
        "m",

        canvas.width - 210,

        65

    );

}


/* =================================
   GAME LOOP
================================= */

function gameLoop() {

    update();


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    drawBackground();

    drawTrees();

    drawPlayer();

    drawMonster();

    drawHUD();


    requestAnimationFrame(
        gameLoop
    );

}

</script>

</body>
</html>
